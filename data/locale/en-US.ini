Name="macOS Background Removal"
Quality="Quality"
Quality.Accurate="Accurate"
Quality.Balanced="Balanced"
Quality.Fast="Fast"
Processor="Processor"
Processor.Description="Where the segmentation model runs. On the GPU it competes with OBS for rendering and encoding time; the Neural Engine does not."
Processor.Auto="Automatic"
Processor.NeuralEngine="Neural Engine"
Processor.GPU="GPU"
Processor.CPU="CPU"
Threshold="Threshold"
Threshold.Description="How confident the mask has to be before a pixel is kept. Lower keeps more of the subject (hair, shoulders), higher cuts tighter."
Softness="Edge softness"
Softness.Description="Width of the transition between kept and removed. Higher gives a softer, more feathered edge."
Outline="Outline smoothing"
Outline.Description="Rounds off the outline before it is cut. Higher gives a smoother, steadier contour but loses fine detail such as gaps between fingers."
Refinement="Edge refinement"
Refinement.Description="Snaps the mask edge to real edges in the picture. Higher follows colour differences more strictly; 0 only smooths."
Smoothing="Temporal smoothing"
Smoothing.Description="Holds the mask steady wherever the picture itself has not changed, which removes flicker. Where the picture changes the new mask is used at once, so this does not cause trailing."
Defringe="Defringe"
Defringe.Description="Replaces leftover background colour on the edge with colour from just inside the subject."
SyncAuto="Automatic mask sync"
SyncAuto.Description="Holds the video back by just enough frames for each frame to be shown with the mask computed from it, and adapts if segmentation gets slower or faster."
SyncDelay="Mask sync delay (frames)"
SyncDelay.Description="Holds the video back by this many frames so each frame is shown with the mask that was computed from it. 0 shows the newest frame with the newest available mask, which leaves a halo on movement."
